<style>
:root {

  --bg-layer: radial-gradient(900px 500px at 14% -10%, rgba(255,255,255,.95), transparent 64%), radial-gradient(800px 520px at 92% 10%, rgba(223,226,233,.58), transparent 68%), linear-gradient(180deg,#f6f7f8 0%,#f1f2f4 65%,#f5f5f6 100%);
  --surface: rgba(255,255,255,.76);
  --surface-strong: rgba(255,255,255,.92);
  --glass: rgba(255,255,255,.44);
  --glass-edge: rgba(255,255,255,.76);
  --text: #111114;
  --muted: #74747a;
  --line: rgba(17,17,20,.07);
  --hover: rgba(255,255,255,.94);
  --chip: rgba(255,255,255,.54);
  --radius: 18px;
  --pill: 999px;
  --max: 1060px;
  --page-x: max(34px, calc((100vw - var(--max)) / 2));
  --page-w: min(var(--max), calc(100vw - 68px));
  --header-x: 64px;
  --header-top: 0px;
  --header-h: 48px;
  --action-size: 36px;
  --action-gap: 4px;
  --scroll-offset: 68px;
}
body.dark-mode {
  --bg: #09090b;
  --bg-layer: radial-gradient(850px 520px at 14% -10%, rgba(72,72,82,.24), transparent 64%), radial-gradient(760px 520px at 92% 12%, rgba(42,45,54,.22), transparent 68%), linear-gradient(180deg,#0d0d0f 0%,#08080a 72%,#0c0c0e 100%);
  --surface: rgba(28,28,31,.78);
  --surface-strong: rgba(34,34,38,.94);
  --glass: rgba(20,20,23,.56);
  --glass-edge: rgba(255,255,255,.11);
  --text: #f5f5f7;
  --muted: #9b9ba1;
  --line: rgba(255,255,255,.085);
  --hover: rgba(40,40,44,.95);
  --chip: rgba(255,255,255,.075);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  min-height: 100vh;
  overflow-x: hidden;
  background: var(--bg-layer);
  background-attachment: fixed;
  color: var(--text);
  font: 16px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button, input { font: inherit; }
button, a { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
::-webkit-scrollbar { width: 7px; height: 7px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(128,128,128,.22); border-radius: 99px; }

.header, .search-popover, .scroll-top-btn {
  backdrop-filter: blur(30px) saturate(190%);
  -webkit-backdrop-filter: blur(30px) saturate(190%);
}
.header {
  position: fixed;
  z-index: 1000;
  top: 0;
  left: 0;
  width: 100%;
  height: calc(var(--header-h) + env(safe-area-inset-top));
  padding: env(safe-area-inset-top) max(var(--header-x), env(safe-area-inset-right)) 0 max(var(--header-x), env(safe-area-inset-left));
  display: grid;
  grid-template-columns: 144px minmax(0, 1fr) 96px;
  align-items: center;
  background:
    linear-gradient(180deg, rgba(255,255,255,.78), rgba(255,255,255,.50)),
    rgba(250,251,252,.72);
  border-top: 0;
  border-bottom: 1px solid rgba(17,17,20,.055);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.98),
    inset 0 -1px 0 rgba(255,255,255,.48);
  isolation: isolate;
}
.header::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(70% 100% at 18% -45%, rgba(255,255,255,.90), transparent 72%),
    linear-gradient(90deg, rgba(255,255,255,.32), transparent 30%, transparent 70%, rgba(255,255,255,.24));

}

  background:
    linear-gradient(180deg, rgba(58,58,64,.62), rgba(30,30,35,.40)),

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.18),
    inset 0 -1px 0 rgba(255,255,255,.055);
}

  background:
    radial-gradient(70% 100% at 18% -45%, rgba(255,255,255,.14), transparent 72%),

  opacity: .90;
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {

}
.logo {
  width: max-content;
  height: 100%;
  padding: 0;
  border: 0;
  background: transparent;
  display: inline-flex;
  align-items: center;
  justify-content: flex-start;
  cursor: pointer;
  transition: transform .18s ease, opacity .18s ease;
}
.logo:hover { opacity: .78; }
.logo:active { transform: scale(.97); }
.logo img { display: block; width: auto; height: 21px; object-fit: contain; }
.sidebar {
  min-width: 0;
  max-width: min(940px, calc(100vw - 280px));
  justify-self: center;
  overflow: hidden;
}
#category-list {
  list-style: none;
  margin: 0;
  padding: 0 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 2px;
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: none;
  overscroll-behavior-inline: contain;
  scroll-snap-type: x proximity;
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%);
  mask-image: linear-gradient(90deg, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%);
}
#category-list::-webkit-scrollbar { display: none; }
#category-list li { flex: 0 0 auto; scroll-snap-align: center; }
.category-btn {
  min-height: 27px;
  padding: 0 11px;
  border: 0;
  border-radius: var(--pill);
  background: transparent;
  color: #6d6d72;
  cursor: pointer;
  white-space: nowrap;
  font-size: 13px;
  line-height: 1;
  font-weight: 540;
  letter-spacing: -.012em;
  transition: background .18s ease, color .18s ease, transform .18s ease;
}
body.dark-mode .category-btn { color: #a4a4aa; }
.category-btn:hover { color: var(--text); background: rgba(0,0,0,.045); }
body.dark-mode .category-btn:hover { background: rgba(255,255,255,.07); }
.category-btn:active { transform: scale(.97); }
.category-btn.active {
  color: #fff;
  background: #050505;
  font-weight: 650;
}
body.dark-mode .category-btn.active { color: #09090b; background: #f5f5f7; }
.header-actions {
  position: relative;
  justify-self: end;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: var(--action-gap);
}
.icon-btn {
  width: var(--action-size);
  height: var(--action-size);
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: #505054;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 16px;
  transition: background .18s ease, color .18s ease, transform .18s ease;
}
body.dark-mode .icon-btn { color: #d2d2d7; }
.icon-btn:hover { color: var(--text); background: rgba(0,0,0,.055); }
body.dark-mode .icon-btn:hover { background: rgba(255,255,255,.075); }
.icon-btn:active { transform: scale(.92); }
.search-popover {
  position: fixed;
  z-index: 1100;
  top: calc(var(--header-h) + 8px + env(safe-area-inset-top));
  right: calc(var(--header-x) + var(--action-size) + var(--action-gap));
  background: rgba(255,255,255,.94);
  border: 1px solid rgba(17,17,20,.08);
  box-shadow: 0 18px 48px rgba(0,0,0,.12);
}
body.dark-mode .search-popover {
  background: rgba(28,28,31,.95);
  border-color: rgba(255,255,255,.10);
  box-shadow: 0 18px 48px rgba(0,0,0,.34);
}
.search-popover {
  width: min(420px, calc(100vw - var(--header-x) - var(--header-x)));
  min-height: 56px;
  padding: 6px 7px 6px 16px;
  border-radius: 18px;
  display: flex;
  align-items: center;
  gap: 10px;
  opacity: 0;
  visibility: hidden;
  transform: translateY(-6px) scale(.985);
  transform-origin: top right;
  pointer-events: none;
  transition: opacity .16s ease, transform .16s ease, visibility .16s ease;
}
.search-popover.open { opacity: 1; visibility: visible; transform: none; pointer-events: auto; }
.search-popover > i { color: var(--muted); font-size: 14px; }
.search-input {
  flex: 1;
  min-width: 0;
  height: 42px;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--text);
  font-size: 15px;
  outline: none;
}
.search-input::placeholder { color: var(--muted); opacity: .78; }
.search-close { width: 38px; height: 38px; font-size: 14px; }
.main {
  width: var(--page-w);
  margin-left: var(--page-x);
  min-height: 100vh;
  padding: calc(var(--header-top) + var(--header-h) + 36px + env(safe-area-inset-top)) 0 calc(90px + env(safe-area-inset-bottom));
}
@keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.welcome-block {
  min-height: 112px;
  margin: 0 0 28px;
  padding: 14px 6px 18px;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 28px;
  scroll-margin-top: var(--scroll-offset);
  animation: fadeInUp .4s ease both;
  transition: max-height .3s ease, opacity .2s ease, margin .3s ease, padding .3s ease;
}
.welcome-block.hidden { min-height: 0; max-height: 0; margin: 0; padding-block: 0; opacity: 0; overflow: hidden; }
.time-capsule { margin: 0 0 6px; font-size: 39px; line-height: 1; font-weight: 680; letter-spacing: -.045em; font-variant-numeric: tabular-nums; }
.welcome-info { color: var(--muted); font-size: 13px; font-weight: 550; }
.stats-row { display: flex; align-items: flex-end; }
.stat-item { min-width: 112px; padding: 2px 18px 1px; }
.stat-item + .stat-item { border-left: 1px solid var(--line); }
.stat-num { margin: 0 0 3px; font-size: 20px; line-height: 1.1; font-weight: 680; }
.stat-label { color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.stat-img-wrapper { height: 20px; display: flex; align-items: center; margin-bottom: 3px; }
.stat-img-wrapper img { height: 100%; max-width: 100%; object-fit: contain; opacity: .68; filter: grayscale(100%); }
body.dark-mode .stat-img-wrapper img { filter: grayscale(100%) invert(1); }
.section { margin-bottom: 42px; scroll-margin-top: var(--scroll-offset); animation: fadeInUp .45s ease both; }
.section-header {
  position: static;
  min-height: 0;
  margin: 0 0 8px;
  padding: 4px 2px 6px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  background: transparent;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
}
.section-header h2 {
  margin: 0;
  font-size: 19px;
  line-height: 1.2;
  font-weight: 650;
  letter-spacing: -.025em;
}
.open-all {
  border: 0;
  border-radius: var(--pill);
  padding: 4px 6px;
  background: transparent;
  color: color-mix(in srgb, var(--muted) 86%, transparent);
  cursor: pointer;
  font-size: 10.5px;
  font-weight: 600;
}
.open-all:hover { color: var(--text); background: transparent; }
.cards { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.card {
  min-width: 0;
  min-height: 80px;
  padding: 14px;
  display: flex;
  align-items: center;
  border: 1px solid var(--glass-edge);
  border-radius: var(--radius);
  background: var(--surface);
  transition: transform .18s ease, background .18s ease, border-color .18s ease;
}
.card:hover { transform: translateY(-2px); background: var(--hover); border-color: color-mix(in srgb, var(--glass-edge) 78%, var(--text) 8%); }
.card:active { transform: scale(.985); }
.card-icon {
  width: 46px;
  height: 46px;
  margin-right: 13px;
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border-radius: 13px;
  background: color-mix(in srgb, var(--surface-strong) 82%, transparent);
  border: 1px solid var(--glass-edge);
}
.card-icon img { width: 70%; height: 70%; object-fit: contain; opacity: 0; transition: opacity .22s ease; }
.card-icon img.loaded { opacity: 1; }
.card-meta { min-width: 0; flex: 1; }
.card-title { margin-bottom: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 650; }
.card-url { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 11px; }
mark { background: var(--text); color: var(--bg); padding: 0 2px; border-radius: 3px; }
.empty-state, .error-state { padding: 90px 20px; text-align: center; color: var(--muted); }
.empty-state i, .error-state i { display: block; margin-bottom: 14px; font-size: 32px; opacity: .5; }
.empty-state h3, .error-state h3 { margin: 0 0 6px; color: var(--text); font-size: 20px; }
.empty-state p, .error-state p { margin: 0; font-size: 13px; }
.scroll-top-btn {
  position: fixed;
  right: max(16px, env(safe-area-inset-right));
  bottom: max(16px, env(safe-area-inset-bottom));
  z-index: 900;
  width: 44px;
  height: 44px;
  padding: 0;
  border-radius: 50%;
  color: var(--text);
  cursor: pointer;
  opacity: 0;
  visibility: hidden;
  transform: translateY(10px);
  transition: opacity .2s ease, transform .2s ease;
}
.scroll-top-btn.show { opacity: 1; visibility: visible; transform: none; }
.footer { padding: 38px 18px 0; text-align: center; color: var(--muted); font-size: 12px; }

@media (max-width: 980px) {
  :root { --page-x: 28px; --page-w: calc(100vw - 56px); --header-x: 46px; --header-h: 44px; --action-size: 34px; --action-gap: 4px; --scroll-offset: 64px; }
  .header { grid-template-columns: 120px minmax(0,1fr) 88px; }

}
@media (max-width: 780px) {

}
@media (max-width: 640px) {
  :root { --page-x: 36px; --page-w: calc(100vw - 72px); --header-x: 20px; --header-h: 40px; --action-size: 28px; --action-gap: 2px; --scroll-offset: 58px; }
  body { background-attachment: scroll; }
  .header { grid-template-columns: 92px minmax(0,1fr) 62px; column-gap: 5px; backdrop-filter: blur(26px) saturate(185%); -webkit-backdrop-filter: blur(26px) saturate(185%); }

  .category-btn { min-height: 22px; padding-inline: 6px; font-size: 11px; }

  .main { padding-top: calc(var(--header-h) + 24px + env(safe-area-inset-top)); }
  .welcome-block { min-height: auto; padding: 12px 4px; margin-bottom: 18px; align-items: flex-start; flex-direction: column; gap: 15px; }
  .time-capsule { font-size: 32px; }
  .welcome-info { font-size: 12px; }
  .stats-row { width: 100%; }
  .stat-item { min-width: 0; flex: 1; padding: 0 14px 0 0; }

  .section { margin-bottom: 34px; }

  .section-header h2 { font-size: 18px; }
  .open-all { padding-inline: 5px; font-size: 10px; }
  .cards { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 14px; }
  .card { min-height: 78px; padding: 15px 14px; border-radius: 15px; }

}
@media (max-width: 370px) {
  :root { --page-x: 24px; --page-w: calc(100vw - 48px); --header-x: 16px; }

  .category-btn { padding-inline: 5px; font-size: 10.5px; }

@media (hover: none) {
  .card:hover { transform: none; background: var(--surface); }
  .category-btn:hover, .icon-btn:hover, .open-all:hover { background: transparent; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>

<body>
<header class="header">

</header>

<main class="main" id="mainContent">

      <div class="stat-item">
        <div class="stat-img-wrapper"><img src="https://hitscounter.dev/api/hit?url=https%3A%2F%2Fwww.ulefone.gq%2F&color=%23000000" alt="Visitor Counter"></div>
        <div class="stat-label">Visits</div>
      </div>
    </div>
  </section>
  <div id="content-area"></div>
  <footer class="footer">© <span id="year"></span> Ulefone Navigation</footer>
</main>
<button id="scrollTopBtn" class="scroll-top-btn" type="button" title="返回顶部" aria-label="返回顶部"><i class="fas fa-arrow-up"></i></button>
<script src="data.js"></script>
<script>
(() => {
  'use strict';

  const $ = (selector, root = document) => root.querySelector(selector);
  const els = {
    body: document.body,
    logo: $('#siteLogo'),
    categories: $('#category-list'),
    content: $('#content-area'),
    welcome: $('#section-top'),
    search: $('#search'),
    searchClose: $('#searchClose'),
    searchPopover: $('#searchPopover'),
    searchToggle: $('#searchToggle'),
    scrollTop: $('#scrollTopBtn')
  };
  const themeMedia = window.matchMedia('(prefers-color-scheme: dark)');
  let scrollObserver = null;
  let userTheme = localStorage.getItem('theme');
  if (!userTheme) {
    const legacyTheme = localStorage.getItem('darkMode');
    if (legacyTheme === 'enabled') userTheme = 'dark';
    if (legacyTheme === 'disabled') userTheme = 'light';
  }

  function escapeRegExp(value) {
    return value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  function safeUrl(value) {
    try {
      const parsed = new URL(value, location.href);
      return /^https?:$/.test(parsed.protocol) ? parsed.href : '#';
    } catch {
      return '#';
    }
  }

  function getDomain(url) {
    try { return new URL(url).hostname.replace(/^www\./, '') || 'link'; }
    catch { return 'link'; }
  }

  function fallbackIcon(name) {
    return `https://ui-avatars.com/api/?name=${encodeURIComponent(name || 'Link')}&background=e9e9ec&color=333&size=64&bold=true`;
  }

  function faviconFor(item) {
    if (item.icon && safeUrl(item.icon) !== '#') return safeUrl(item.icon);
    return `https://www.google.com/s2/favicons?sz=64&domain_url=${encodeURIComponent(item.url || '')}`;
  }

  function appendHighlightedText(target, text, query) {
    if (!query) { target.textContent = text; return; }
    const regex = new RegExp(`(${escapeRegExp(query)})`, 'ig');
    let lastIndex = 0;
    text.replace(regex, (match, _group, offset) => {
      target.append(document.createTextNode(text.slice(lastIndex, offset)));
      const mark = document.createElement('mark');
      mark.textContent = match;
      target.append(mark);
      lastIndex = offset + match.length;
      return match;
    });
    target.append(document.createTextNode(text.slice(lastIndex)));
  }

  function createCard(item, query = '') {
    const href = safeUrl(item.url);
    const card = document.createElement('a');
    card.className = 'card';
    card.href = href;
    card.target = '_blank';
    card.rel = 'noopener noreferrer';
    if (href === '#') {
      card.removeAttribute('target');
      card.setAttribute('aria-disabled', 'true');
      card.addEventListener('click', e => e.preventDefault());
    }

    const iconWrap = document.createElement('div');
    iconWrap.className = 'card-icon';
    const img = document.createElement('img');
    img.src = faviconFor(item);
    img.alt = '';
    img.loading = 'lazy';
    img.addEventListener('load', () => img.classList.add('loaded'), { once: true });
    img.addEventListener('error', () => {
      if (img.dataset.fallback) return;
      img.dataset.fallback = '1';
      img.src = fallbackIcon(item.name);
      img.classList.add('loaded');
    });
    iconWrap.append(img);

    const meta = document.createElement('div');
    meta.className = 'card-meta';
    const title = document.createElement('div');
    title.className = 'card-title';
    title.title = item.name || '';
    appendHighlightedText(title, String(item.name || 'Untitled'), query);
    const domain = document.createElement('div');
    domain.className = 'card-url';
    appendHighlightedText(domain, getDomain(item.url), query);
    meta.append(title, domain);
    card.append(iconWrap, meta);
    return card;
  }

  function createSection(key, items, index, query = '') {
    const section = document.createElement('section');
    section.className = 'section';
    section.id = `section-${index}`;
    section.style.animationDelay = `${Math.min(index * .045, .32)}s`;

    const header = document.createElement('div');
    header.className = 'section-header';
    const h2 = document.createElement('h2');
    h2.textContent = key;
    const openAll = document.createElement('button');
    openAll.type = 'button';
    openAll.className = 'open-all';
    openAll.textContent = `打开全部 ${items.length}`;
    openAll.title = `打开 ${key} 中的全部链接`;
    openAll.addEventListener('click', () => {
      items.forEach(item => {
        const href = safeUrl(item.url);
        if (href !== '#') window.open(href, '_blank', 'noopener,noreferrer');
      });
    });
    header.append(h2, openAll);

    const cards = document.createElement('div');
    cards.className = 'cards';
    items.forEach(item => cards.append(createCard(item, query)));
    section.append(header, cards);
    return section;
  }

  function setActiveNav(index) {
    const buttons = [...els.categories.querySelectorAll('.category-btn')];
    buttons.forEach(btn => { btn.classList.remove('active'); btn.removeAttribute('aria-current'); });
    const active = buttons[index];
    if (active) {
      active.classList.add('active');
      active.setAttribute('aria-current', 'page');
      active.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    }
  }

  function setupScrollSpy() {
    if (scrollObserver) scrollObserver.disconnect();
    const sections = [els.welcome, ...document.querySelectorAll('.section')];
    if (!sections.length) return;
    scrollObserver = new IntersectionObserver(entries => {
      const visible = entries.filter(e => e.isIntersecting).sort((a,b) => Math.abs(a.boundingClientRect.top) - Math.abs(b.boundingClientRect.top));
      if (!visible[0]) return;
      const target = visible[0].target;
      if (target === els.welcome) return;
      const idx = Number(target.id.replace('section-', ''));
      if (Number.isFinite(idx)) setActiveNav(idx);
    }, { rootMargin: '-18% 0px -68% 0px', threshold: 0 });
    sections.forEach(section => scrollObserver.observe(section));
  }

  function render(query = '') {
    if (typeof data === 'undefined' || !data || typeof data !== 'object') {
      els.content.innerHTML = '<div class="error-state"><i class="fas fa-triangle-exclamation"></i><h3>无法加载书签数据</h3><p>请确认 data.js 与 index.html 位于同一目录。</p></div>';
      return;
    }

    const normalized = query.trim().toLowerCase();
    els.content.replaceChildren();
    els.categories.replaceChildren();

    const allEntries = Object.entries(data);
    const filteredEntries = allEntries.map(([key, items]) => {
      if (!normalized) return [key, items];
      return [key, items.filter(item => {
        const haystack = `${item.name || ''} ${item.url || ''} ${getDomain(item.url)}`.toLowerCase();
        return haystack.includes(normalized);
      })];
    }).filter(([, items]) => items.length > 0);


    filteredEntries.forEach(([key, items], index) => {
      const li = document.createElement('li');
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = `category-btn${index === 0 ? ' active' : ''}`;
      if (index === 0) btn.setAttribute('aria-current', 'page');
      btn.textContent = key;
      btn.addEventListener('click', () => document.getElementById(`section-${index}`)?.scrollIntoView({ behavior: 'smooth', block: 'start' }));
      li.append(btn);
      els.categories.append(li);
      els.content.append(createSection(key, items, index, normalized));
    });

    els.welcome.classList.toggle('hidden', Boolean(normalized));
    $('#stat-total').textContent = Object.values(data).flat().length;

    if (normalized && !filteredEntries.length) {
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.innerHTML = '<i class="fas fa-search"></i><h3>没有找到结果</h3>';
      const p = document.createElement('p');
      p.textContent = `没有匹配“${query.trim()}”的书签。`;
      empty.append(p);
      els.content.append(empty);
    }
    setupScrollSpy();
  }

  function effectiveDark() {
    return userTheme === 'dark' || (!userTheme && themeMedia.matches);
  }

  function applyTheme() {
    const dark = effectiveDark();
    els.body.classList.toggle('dark-mode', dark);
    // 使用完整 Ulefone Logo；深色模式切换为完整白色版本以确保可读性。
    els.logo.src = dark
      ? 'https://wangwenzhi.eu.org/images/ulefone-logo/logo-white.png'
      : 'https://wangwenzhi.eu.org/images/ulefone-logo/logo.png';
  }

  function setSearchOpen(open) {
    els.searchPopover.classList.toggle('open', open);
    els.searchPopover.setAttribute('aria-hidden', String(!open));
    els.searchToggle.setAttribute('aria-expanded', String(open));
    if (open) requestAnimationFrame(() => els.search.focus());
  }

  function updateClock() {
    const now = new Date();
    $('#live-time').textContent = now.toLocaleTimeString('en-GB', { hour12: false });
    $('#date-info').textContent = now.toLocaleDateString('zh-CN', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  }

  $('#homeBtn').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
  els.search.addEventListener('input', e => render(e.target.value));
  els.searchToggle.addEventListener('click', e => { e.stopPropagation(); setSearchOpen(!els.searchPopover.classList.contains('open')); });
  els.searchClose.addEventListener('click', () => setSearchOpen(false));
  els.searchPopover.addEventListener('click', e => e.stopPropagation());
  document.addEventListener('click', () => setSearchOpen(false));
  document.addEventListener('keydown', e => {
    const shortcut = (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k';
    if ((e.key === '/' && document.activeElement !== els.search) || shortcut) {
      e.preventDefault();
      setSearchOpen(true);
    }
    if (e.key === 'Escape') setSearchOpen(false);
  });
  els.scrollTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
  window.addEventListener('scroll', () => els.scrollTop.classList.toggle('show', window.scrollY > 320), { passive: true });
  themeMedia.addEventListener?.('change', () => { if (!userTheme) applyTheme(); });

  els.categories.addEventListener('wheel', e => {
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX) && els.categories.scrollWidth > els.categories.clientWidth) {
      e.preventDefault();
      els.categories.scrollLeft += e.deltaY;
    }
  }, { passive: false });

  $('#year').textContent = new Date().getFullYear();
  updateClock();
  setInterval(updateClock, 1000);
  applyTheme();
  render();
})();
</script>
</body>
</html>
